<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Optimización SEO y Open Graph -->
    <meta name="description" content="Landing Page profesional - Proyecto Unidad 3 UPTC">
    <meta property="og:title" content="Portafolio UPTC">
    <meta property="og:description" content="Landing Page interactiva creada por el equipo de desarrollo.">
    <meta property="og:type" content="website">
    
    <title>Landing Page - Proyecto Unidad 3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navegación -->
    <header class="header">
        <nav class="nav-container">
            <a href="#" class="logo">UPTC<span>Dev</span></a>
            <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#caracteristicas">Características</a></li>
                <li><a href="#contacto">Contacto</a></li>
                <li><button id="theme-toggle" class="btn-theme">🌙</button></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1>Bienvenido a nuestro Proyecto</h1>
            <p>Desarrollo web colaborativo con las mejores prácticas.</p>
            <a href="#contacto" class="btn-primary">Contáctanos</a>
        </div>
    </section>

    <!-- Formulario de Contacto (Preparado para Formspree) -->
    <section id="contacto" class="contacto">
        <h2>Ponte en contacto</h2>
        <form id="contact-form" action="https://formspree.io/f/TU_ENDPOINT_AQUI" method="POST">
            <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre" required>
            <input type="email" id="email" name="email" placeholder="Tu Correo" required>
            <button type="submit" class="btn-primary">Enviar Mensaje</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Proyecto Unidad 3 UPTC. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
